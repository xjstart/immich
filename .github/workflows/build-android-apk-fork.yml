name: Build Android APK Fork

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Optional numeric suffix for a separate package id, e.g. app.alextran.immich.pr9999'
        required: false
        default: '9999'
      split_per_abi:
        description: 'Build smaller ABI-specific APKs in addition to the universal APK'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-android-apk-fork-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Flutter and Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.gradle/caches
            ~/.gradle/wrapper
            mobile/android/.gradle
          key: android-apk-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/gradle/libs.versions.toml') }}
          restore-keys: |
            android-apk-${{ runner.os }}-

      - name: Install Flutter dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate translations
        working-directory: mobile
        run: |
          dart run easy_localization:generate -S ../i18n
          dart run bin/generate_keys.dart
          dart format lib/generated/codegen_loader.g.dart lib/generated/translations.g.dart

      - name: Generate platform APIs
        working-directory: mobile
        run: |
          find pigeon -name '*.dart' -print0 | xargs -0 -n1 -P4 -I{} dart run pigeon --input {}
          dart format lib/platform/

      - name: Warm Gradle distribution cache
        shell: bash
        run: |
          set -euo pipefail
          gradle_url="https://services.gradle.org/distributions/gradle-8.14-all.zip"
          zip_path="$RUNNER_TEMP/gradle-8.14-all.zip"

          for attempt in 1 2 3 4 5; do
            echo "Downloading Gradle distribution, attempt ${attempt}..."
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 --max-time 600 "$gradle_url" --output "$zip_path"; then
              echo "Gradle distribution downloaded to $zip_path"
              break
            fi

            if [ "$attempt" = "5" ]; then
              echo "Failed to download Gradle distribution after ${attempt} attempts."
              exit 1
            fi

            sleep $((attempt * 20))
          done

          export ZIP_URL="file://$zip_path"
          python3 -c 'from pathlib import Path; import os; wrapper = Path("mobile/android/gradle/wrapper/gradle-wrapper.properties"); lines = wrapper.read_text().splitlines(); output = ["distributionUrl=" + os.environ["ZIP_URL"] if line.startswith("distributionUrl=") else "validateDistributionUrl=false" if line.startswith("validateDistributionUrl=") else line for line in lines]; wrapper.write_text("\n".join(output) + "\n")'
          cat mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Create Android keystore when secrets are configured
        working-directory: mobile
        env:
          KEY_JKS: ${{ secrets.KEY_JKS }}
        run: |
          if [ -n "$KEY_JKS" ]; then
            printf "%s" "$KEY_JKS" | base64 -d > android/key.jks
            echo "Using custom Android keystore from repository secrets."
          else
            echo "No KEY_JKS secret configured; Gradle will use the debug signing config for this APK."
          fi

      - name: Build universal APK
        working-directory: mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: flutter build apk --release

      - name: Build ABI-specific APKs
        if: ${{ inputs.split_per_abi }}
        working-directory: mobile
        env:
          ALIAS: ${{ secrets.ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: immich-android-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
